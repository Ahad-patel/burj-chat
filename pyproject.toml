[project]
name = "burj-ai-assistant"
version = "0.1.0"
description = "Grounded AI assistant for Burj Constructions — FastAPI backend + embeddable widget"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.27",
    "google-genai>=0.3",
    "anthropic>=0.39",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
# Scraper-only deps. Not installed into the production image.
kb = [
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "respx>=0.21",
    "types-beautifulsoup4>=4.12",
    "types-pyyaml>=6.0",
    "types-defusedxml>=0.7",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package lives under backend/ but imports as `app`.
packages = ["backend/app"]


# ---------------------------------------------------------------------------
# ruff — linter + formatter. Replaces black, isort, flake8, and bandit.
# The `S` ruleset IS bandit, ported to ruff; running both would be redundant.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]
extend-exclude = ["knowledge-base/raw", "widget"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort — import ordering
    "B",        # flake8-bugbear — likely bugs
    "S",        # flake8-bandit — security (replaces standalone bandit)
    "C4",       # flake8-comprehensions
    "UP",       # pyupgrade — modern Python idioms
    "ANN",      # flake8-annotations — enforce type hints
    "ASYNC",    # flake8-async — async/await footguns
    "RUF",      # ruff-specific
    "PT",       # flake8-pytest-style
    "SIM",      # flake8-simplify
    "TID",      # flake8-tidy-imports
    "PTH",      # prefer pathlib over os.path
]
ignore = [
    "ANN401",   # allow `Any` where genuinely needed (SDK boundaries)
    "E501",     # line length — the formatter owns this
]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = [
    "S101",     # assert is the point of a test
    "S105",     # hardcoded "passwords" in fixtures are fake
    "S106",
    "ANN201",   # test functions don't need return annotations
]
"knowledge-base/**" = ["S310"]  # urlopen — we control the URLs

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
docstring-code-format = true


# ---------------------------------------------------------------------------
# mypy — strict. The domain layer is 100% our own code, so strict is realistic
# there; SDK boundaries get targeted per-module relaxations, never blanket ones.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
show_error_codes = true
pretty = true
files = ["backend/app", "backend/tests", "knowledge-base"]
# The hyphen in "knowledge-base" makes it an invalid package name, but it is a
# perfectly valid sys.path entry — so build_kb.py imports as a top-level module.
mypy_path = "backend:knowledge-base"

[[tool.mypy.overrides]]
# Third-party packages that ship no type information.
module = ["slowapi.*", "google.genai.*"]
ignore_missing_imports = true


# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend", "knowledge-base"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: hits a real external service; skipped unless credentials are present",
]


# ---------------------------------------------------------------------------
# coverage — 80% overall, but the guardrails carry a much higher bar because
# they are the one thing in this codebase that must not regress.
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["backend/app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
