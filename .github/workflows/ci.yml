name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch — no point burning minutes on a
# commit that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  UV_FROZEN: "1"  # fail if uv.lock is out of date rather than silently resolving

jobs:
  quality:
    name: Lint, types, and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      # ruff's `S` ruleset is bandit, ported. Running both would surface the
      # same findings twice, so bandit is deliberately not in this pipeline.
      - name: ruff (lint + security)
        run: uv run --all-extras ruff check --output-format=github .

      - name: ruff (format check)
        run: uv run --all-extras ruff format --check --diff .

      - name: mypy (strict)
        run: uv run --all-extras mypy

      # Rebuilds from the committed raw/ HTML — no network, so a site outage
      # cannot redden the build. Catches a knowledge_base.xml edited by hand or
      # left stale after a builder change.
      - name: Knowledge base is up to date
        run: uv run --extra kb python knowledge-base/build_kb.py --check

      - name: pytest
        run: uv run --all-extras pytest --cov --cov-report=term-missing --cov-report=xml

      # The guardrails are the one thing in this codebase that must not
      # regress, so they carry a higher bar than the 80% project-wide gate.
      - name: Guardrail coverage
        run: uv run --all-extras pytest --cov=backend/app/domain/guardrails --cov-fail-under=95 -q

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  supply-chain:
    name: Secrets and dependency CVEs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks needs full history to scan past commits

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install gitleaks
        run: |
          set -euo pipefail
          VERSION=8.21.2
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks (secret scan)
        run: gitleaks detect --source . --redact --verbose --exit-code 1

      - name: Export locked dependencies
        run: uv export --frozen --all-extras --no-emit-project --no-hashes -o requirements.txt

      - name: pip-audit (dependency CVEs)
        run: uvx pip-audit --requirement requirements.txt --strict

  sast:
    name: semgrep
    runs-on: ubuntu-latest
    # Advisory only. semgrep is noisy on a codebase this small, and a check
    # nobody trusts is worse than no check. Promote to blocking once its signal
    # rate has been observed on this repo for a few weeks.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run semgrep
        run: |
          pipx install semgrep
          semgrep --config=p/python --config=p/security-audit --error --skip-unknown-extensions .

  container:
    name: Container image builds for ARM64
    runs-on: ubuntu-latest
    # The deployment target is Oracle's Always Free tier, which is Ampere ARM.
    # An image that builds on x86 can still fail on aarch64 when a dependency
    # has no wheel for it, so this builds the architecture that actually runs.
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build for linux/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves it compiles; this proves it actually serves. Loaded as
      # the runner's own architecture so it can be executed here.
      - name: Build for local execution
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: burj-chat-api:ci
          cache-from: type=gha

      - name: Container boots and reports ready
        run: |
          docker run -d --name burj \
            -e GEMINI_API_KEY=ci-smoke-test \
            -e APP_ENV=production \
            -p 8000:8000 burj-chat-api:ci

          for i in $(seq 1 30); do
            if curl -sf localhost:8000/ready > /dev/null; then
              echo "ready after ${i}s"
              break
            fi
            sleep 1
          done

          curl -sf localhost:8000/health | tee /dev/stderr | grep -q '"status":"ok"'
          curl -sf localhost:8000/ready  | grep -q '"status":"ready"'

          # A guardrail refusal needs no provider call, so the whole chain is
          # verifiable in CI without a real API key.
          curl -sf -X POST localhost:8000/api/v1/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"who is the prime minister of India"}' \
            | grep -q '"is_fallback":true'

          # Docs must be off in production.
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8000/docs)" = "404"

          docker logs burj
          docker rm -f burj
